[project]
name = "horus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philipp Rosenfeld", email = "e12314158@student.tuwien.ac.at" }
]
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.12.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "prompt-toolkit>=3.0.52",
    "pyglet>=2.1.15",
    "rich>=15.0.0",
]

[project.scripts]
horus = "horus:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
