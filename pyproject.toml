[project]
name = "horus"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philipp Rosenfeld", email = "Rosenfeld.Philipp@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.12.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "prompt-toolkit>=3.0.52",
    "pyglet>=2.1.15",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
horus = "horus:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "tests_*.py"]
addopts = "--cov=src/horus --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/horus"]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 200  # this codebase doesn't wrap at 79/88 -- avoid noise on every long f-string/docstring

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # pycodestyle errors, pyflakes (real bugs), import sorting

[tool.ruff.lint.per-file-ignores]
# these imports exist purely for their side effect of running @command(...)
# decorators at import time, registering commands into the global Registry --
# nothing in the file itself ever references the imported names directly
"src/horus/kernel/commands/__init__.py" = ["F401"]
"src/horus/__init__.py" = ["F401"]
