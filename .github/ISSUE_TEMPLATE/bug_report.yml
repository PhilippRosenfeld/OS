name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or keys that lead to the problem, in order.
      placeholder: |
        1. Run `sys -C`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead. Add a screenshot if it is a display problem.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hardware
        - Processes
        - Shell
        - Filesystem
        - UI
        - Display
        - Audio
        - Story
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version from the README status line or `src/horus/__about__.py`.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: Windows 11, Python 3.13
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Relevant lines from `horus.log`, or the traceback.
      render: text
