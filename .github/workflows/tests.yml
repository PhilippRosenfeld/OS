name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # windows-latest: moderngl/pyglet need a real GL context/window, which Windows runners
    # provide out of the box (no Xvfb/software-GL setup needed, unlike ubuntu-latest).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
