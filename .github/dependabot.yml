version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "ci"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
